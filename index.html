<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timer">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Timer Allenamento v11</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:background .3s}
body.work{background:#111}body.rest{background:#111}body.done{background:#111}
.app{max-width:600px;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 14px 28px}
h1{text-align:center;margin:0 0 7px;font-size:16px;font-weight:500;opacity:.55}
.card{background:rgba(255,255,255,.045);border-radius:20px;padding:14px;margin-bottom:13px}
.head{display:flex;justify-content:space-between;align-items:center}
.small{font-size:12px;opacity:.8}
.row{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;gap:8px;align-items:center;margin-top:10px;padding:10px;border-radius:16px;background:rgba(255,255,255,.035);transition:transform .12s,opacity .12s,background .12s}
.num{text-align:center;font-weight:800;font-size:14px;opacity:.75}
label{display:block;font-size:10px;opacity:.8;margin:0 0 3px 2px}
input{width:100%;border:0;border-radius:10px;background:#fff;color:#111;padding:9px 6px;text-align:center;font-size:17px;font-weight:700;min-width:0}
input[type=text]{text-align:left;padding-left:10px}
button{border:0;border-radius:13px;padding:13px;font-size:17px;font-weight:700;color:#fff;background:rgba(0,0,0,.28)}
button:active{transform:scale(.98)}
.drag-handle{grid-column:1;grid-row:1;width:42px;height:42px;padding:0;font-size:24px;line-height:1;background:#242428;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.drag-handle:active{cursor:grabbing}
.name-field{grid-column:2;grid-row:1;min-width:0}
.del{grid-column:3;grid-row:1;width:42px;height:42px;padding:0;font-size:24px}
.fields{grid-column:1 / -1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.row.dragging{opacity:.45;background:rgba(50,215,75,.12)}
.drag-placeholder{height:8px;border-radius:8px;background:#32d74b;margin:7px 0;box-shadow:0 0 10px rgba(50,215,75,.35)}
.add{width:100%;margin-top:11px;background:rgba(255,255,255,.18)}
.display{text-align:center;padding:6px 8px 10px;background:#000;border-radius:30px;position:relative;overflow:hidden}
.phase{font-size:22px;font-weight:700;letter-spacing:.1px}
.progress{margin-top:1px;font-size:13px;opacity:.6}
.timer-ring{width:min(76vw,310px);aspect-ratio:1;margin:18px auto 12px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from -90deg,var(--ring,#32d74b) 0deg,var(--ring-progress,360deg),#2d2d33 var(--ring-progress,360deg) 360deg);padding:10px;transition:background .15s linear}
.timer-ring{--ring:#32d74b}.timer-ring.rest{--ring:#1597ff}.timer-ring.done{--ring:#888}
.timer-ring.done{--ring:#888}
.timer-inner{width:100%;height:100%;border-radius:50%;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .08s,box-shadow .08s}.camera-alert .timer-inner{background:#b80f18;box-shadow:0 0 42px rgba(255,45,55,.9);animation:innerFlash .48s steps(2,end) infinite}.camera-alert .timer-ring{--ring:#ff3b30!important}.camera-alert .timer{color:#fff}.camera-alert .status{color:#fff;opacity:1}@keyframes innerFlash{0%,100%{background:#240306;box-shadow:0 0 8px rgba(255,45,55,.25)}50%{background:#d71924;box-shadow:0 0 55px rgba(255,45,55,.95)}}@media(prefers-reduced-motion:reduce){.camera-alert .timer-inner{animation:none;background:#b80f18}}
.timer{font-size:76px;line-height:1;font-weight:300;letter-spacing:-3px;font-variant-numeric:tabular-nums}
.status{min-height:23px;font-size:15px;opacity:.9}
.next{min-height:66px;margin:5px 8px 0;padding:13px 16px;border-radius:18px;background:#16161a;font-size:18px;opacity:1;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.15}.next strong{font-size:23px;margin-top:4px;color:#fff}.next .next-label{font-size:12px;opacity:.6;text-transform:uppercase;letter-spacing:.8px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:13px 22px 0;align-items:start}
.action-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.action-label{font-size:12px;opacity:.78}
.action-btn{width:78px;height:78px;border-radius:50%;padding:0;display:grid;place-items:center;font-size:31px;background:transparent;color:#fff;border:3px solid var(--action-color,#32d74b);box-shadow:0 0 18px color-mix(in srgb,var(--action-color,#32d74b) 35%,transparent);transition:.2s}
.action-btn.ready{background:#32d74b;color:#071b0d;border-color:#32d74b;box-shadow:0 0 25px rgba(50,215,75,.65)}
.action-btn.running,.action-btn.paused{background:transparent;color:var(--action-color,#32d74b);border-color:var(--action-color,#32d74b);box-shadow:0 0 18px color-mix(in srgb,var(--action-color,#32d74b) 45%,transparent)}
.action-btn.reset{background:transparent}
.extra-controls{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:20px 18px 0;padding-top:28px}
.pulse-line{position:absolute;top:0;left:0;right:0;height:2px;background:var(--line-color,#32d74b);box-shadow:0 0 8px var(--line-color,#32d74b);transform-origin:center}
.pulse-line::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:50%;background:var(--line-color,#32d74b);transform:translate(-50%,-50%);box-shadow:0 0 14px var(--line-color,#32d74b);animation:heartPulse .95s ease-in-out infinite}
@keyframes heartPulse{0%,100%{transform:translate(-50%,-50%) scale(.65);opacity:.7}12%{transform:translate(-50%,-50%) scale(1.5);opacity:1}22%{transform:translate(-50%,-50%) scale(.8);opacity:.85}32%{transform:translate(-50%,-50%) scale(1.15);opacity:1}55%{transform:translate(-50%,-50%) scale(.7);opacity:.7}}
.spotify{background:transparent;color:#fff;border:2px solid #666;width:64px;height:64px;border-radius:50%;padding:0;margin:auto;font-size:25px}
.camera-card{display:flex;align-items:center;justify-content:center;gap:10px;background:transparent!important;padding:0!important;margin:0!important;flex-direction:column;border:0!important}
.camera-card .camera-label{font-size:12px;opacity:.82}
@media(prefers-reduced-motion:reduce){.pulse-line::after{animation:none}}
.camera-label{display:flex;align-items:center;gap:10px;font-weight:700}
.camera-icon{font-size:23px}
.switch{position:relative;width:58px;height:34px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0;position:absolute}
.slider{position:absolute;inset:0;background:#3a3a40;border-radius:34px;transition:.2s;cursor:pointer}
.slider:before{content:"";position:absolute;width:28px;height:28px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:#34c759}
.switch input:checked + .slider:before{transform:translateX(24px)}
.switch-text{font-size:12px;opacity:.65;min-width:25px}

.note{font-size:13px;line-height:1.45;opacity:.85}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(0,0,0,.85);padding:11px 14px;border-radius:12px;font-size:14px;z-index:5}
.hidden{display:none}.gear{position:absolute;right:12px;top:12px;width:44px;height:44px;padding:0;border-radius:50%;background:#202024;font-size:23px}.back{position:absolute;left:12px;top:12px;width:44px;height:44px;padding:0;border-radius:50%;background:#202024;font-size:25px}.settings-panel{background:#0f0f12;border-radius:24px;padding:14px;margin-bottom:14px}.settings-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.settings-head button{width:42px;height:42px;padding:0;border-radius:50%}.settings-title{font-size:20px;font-weight:700}.settings-section{font-size:12px;opacity:.6;margin:16px 2px 7px;text-transform:uppercase;letter-spacing:.7px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.08)}.setting-row:last-child{border-bottom:0}.setting-name{font-size:16px}.setting-value{font-size:14px;opacity:.7}.test-alarm{background:#3a1114;border:1px solid #7b252a;margin-top:12px;width:100%}.sequence-title{display:flex;justify-content:space-between;align-items:center}.sequence-card{margin-top:10px}
@media(max-width:430px){
.row{grid-template-columns:42px minmax(0,1fr) 42px}
.timer{font-size:58px}
.timer-ring{width:min(78vw,300px)}
}
</style>
</head>
<body>
<div class="app">
<h1>Timer Allenamento</h1>

<section id="settingsPanel" class="settings-panel hidden">
<div class="settings-head"><div class="settings-title">Impostazioni</div><button id="closeSettings" aria-label="Chiudi impostazioni">×</button></div>
<div class="settings-section">Generali</div>
<div class="setting-row"><span class="setting-name">Ritmo (BPM)</span><span id="bpmSummary" class="setting-value">30</span></div>
<div class="setting-row"><span class="setting-name">Allarme telecamera</span><label class="switch" aria-label="Attiva o disattiva allarme telecamera"><input id="cameraAlarmSettings" type="checkbox"><span class="slider"></span></label></div>
<button id="testCamera" class="test-alarm">⚠ Test allarme telecamera</button>
<div class="settings-section">Sequenza esercizi</div>
<section class="card sequence-card">
<div class="sequence-title"><strong>Sequenza</strong><span id="saved" class="small">salvata</span></div>

<div id="rows"></div>
<button id="add" class="add">＋ Aggiungi esercizio</button>
</section>
</section>

<section id="displayCard" class="card display">
<button id="back" class="back hidden" aria-label="Indietro">‹</button>
<button id="gear" class="gear" aria-label="Impostazioni">⚙</button>
<div id="phase" class="phase">PRONTO</div>
<div id="progress" class="progress">0 / 0</div>
<div id="timerRing" class="timer-ring" aria-label="Timer">
  <div class="timer-inner">
    <div id="timer" class="timer">00:30</div>
    <div id="status" class="status">Pronto</div>
  </div>
</div>
<div id="next" class="next"></div>
</section>

<div class="controls">
<div class="action-wrap"><button id="start" class="action-btn ready" aria-label="Avvia timer">▶</button><div id="startLabel" class="action-label">Start</div></div>
<div class="action-wrap"><button id="reset" class="action-btn reset" aria-label="Reset timer">↻</button><div class="action-label">Reset</div></div>
</div>

<div id="extraControls" class="extra-controls">
<div id="pulseLine" class="pulse-line" aria-hidden="true"></div>
<div class="action-wrap"><button id="spotify" class="spotify" aria-label="Apri Spotify">♫</button><div class="action-label">Spotify</div></div>
<div class="camera-card">
<div class="camera-label"><span class="camera-icon">◉</span><span>Allarme telecamera</span></div>
<label class="switch" aria-label="Attiva o disattiva allarme telecamera"><input id="cameraAlarm" type="checkbox"><span class="slider"></span></label>
<div id="cameraStatus" class="small">OFF</div>
</div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const KEY="timer-allenamento-sequence-v4";

let sequence=[
 {name:"Esercizio 1",work:30,rest:30,bpm:30}
];

let running=false;
let phase="work";
let index=0;
let remaining=30;
let timerId=null;
let lastBeep=0;
let midBeepDone=false;
let audio=null;
let wakeLock=null;
let rhythmId=null;
let cameraAlarm=false;
let cameraAlert=false;

const $=id=>document.getElementById(id);

function positive(v){
 const n=parseInt(v,10);
 return Number.isFinite(n)&&n>0?n:1;
}

function bpmValue(v){
 const n=parseInt(v,10);
 if(!Number.isFinite(n)||n<=0)return 0;
 return Math.min(240,n);
}

function save(){
 localStorage.setItem(KEY,JSON.stringify(sequence));
 $("saved").textContent="salvata";
}

function load(){
 try{
  const x=JSON.parse(localStorage.getItem(KEY));
  if(Array.isArray(x)&&x.length){
   sequence=x.map((a,i)=>({
    name:(typeof a.name==="string"&&a.name.trim())
      ?a.name.trim()
      :"Esercizio "+(i+1),
    work:positive(a.work),
    rest:positive(a.rest),
    bpm:(a.bpm==null?30:bpmValue(a.bpm))
   }));
  }
 }catch(e){}
}

function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

function render(){
 $("rows").innerHTML="";

 sequence.forEach((x,i)=>{
  const r=document.createElement("div");
  r.className="row";

  r.innerHTML=
   '<button class="drag-handle" type="button" data-drag="'+i+'" aria-label="Tieni premuto e trascina per spostare l\'esercizio">☰</button>'+
   '<div class="name-field"><label>NOME ESERCIZIO</label><input type="text" maxlength="28" value="'+
   esc(x.name)+'" data-i="'+i+'" data-t="name" autocomplete="off"></div>'+
   '<button class="del" data-del="'+i+'" aria-label="Elimina esercizio">×</button>'+
   '<div class="fields">'+
   '<div><label>ESERCIZIO</label><input type="number" min="1" value="'+
   x.work+'" data-i="'+i+'" data-t="work"></div>'+
   '<div><label>RECUPERO</label><input type="number" min="1" value="'+
   x.rest+'" data-i="'+i+'" data-t="rest"></div>'+
   '<div><label>BPM</label><input type="number" min="0" max="240" step="1" value="'+
   x.bpm+'" data-i="'+i+'" data-t="bpm" inputmode="numeric"></div>'+
   '</div>';

  $("rows").appendChild(r);
 });

 document.querySelectorAll("#rows input").forEach(el=>{
  el.addEventListener("change",e=>{
   const i=+e.target.dataset.i;
   const t=e.target.dataset.t;

   if(t==="name")
    sequence[i].name=e.target.value.trim()||( "Esercizio "+(i+1));
   else if(t==="bpm")
    sequence[i].bpm=bpmValue(e.target.value);
   else
    sequence[i][t]=positive(e.target.value);

   save();
   render();

   if(!running) reset(false);
  });
 });

 document.querySelectorAll("[data-del]").forEach(b=>{
  b.addEventListener("click",()=>{
   if(sequence.length===1){
    toast("Deve rimanere almeno un esercizio.");
    return;
   }

   sequence.splice(+b.dataset.del,1);
   save();
   render();

   if(!running) reset(false);
  });
 });

 initDragReorder();
}

function initDragReorder(){
 const rowsEl=$("rows");
 let drag=null;
 let pressTimer=null;

 function clearPlaceholder(){
  rowsEl.querySelectorAll(".drag-placeholder").forEach(el=>el.remove());
 }

 function cancelDrag(){
  clearTimeout(pressTimer);
  if(drag){
   drag.row.classList.remove("dragging");
   clearPlaceholder();
   drag=null;
  }
 }

 function finishDrag(){
  if(!drag)return;
  clearTimeout(pressTimer);
  const from=drag.from;
  const to=drag.to;
  const row=drag.row;
  row.classList.remove("dragging");
  clearPlaceholder();
  drag=null;

  if(to!==from){
   const moved=sequence.splice(from,1)[0];
   const target=to>from?to-1:to;
   sequence.splice(target,0,moved);
   save();
   render();
   if(!running) reset(false);
   toast("Sequenza aggiornata");
  }
 }

 function updateTarget(y){
  if(!drag||!drag.active)return;
  const all=[...rowsEl.querySelectorAll(".row")].filter(r=>r!==drag.row);
  let target=all.length;
  for(let i=0;i<all.length;i++){
   const rect=all[i].getBoundingClientRect();
   if(y<rect.top+rect.height/2){target=i;break;}
  }
  drag.to=target;
  clearPlaceholder();
  const ph=document.createElement("div");
  ph.className="drag-placeholder";
  if(target>=all.length) rowsEl.appendChild(ph);
  else rowsEl.insertBefore(ph,all[target]);
 }

 rowsEl.querySelectorAll("[data-drag]").forEach(handle=>{
  handle.addEventListener("pointerdown",e=>{
   if(e.button!==undefined&&e.button!==0)return;
   e.preventDefault();
   const row=handle.closest(".row");
   drag={row,from:+handle.dataset.drag,to:+handle.dataset.drag,active:false};
   try{handle.setPointerCapture(e.pointerId);}catch(err){}
   pressTimer=setTimeout(()=>{
    if(!drag)return;
    drag.active=true;
    row.classList.add("dragging");
    updateTarget(e.clientY);
    if(navigator.vibrate)navigator.vibrate(20);
   },260);
  });

  handle.addEventListener("pointermove",e=>{
   if(!drag)return;
   if(!drag.active)return;
   e.preventDefault();
   updateTarget(e.clientY);
  });

  handle.addEventListener("pointerup",e=>{
   if(!drag)return;
   e.preventDefault();
   if(drag.active) finishDrag();
   else cancelDrag();
  });

  handle.addEventListener("pointercancel",cancelDrag);
 });
}

function toast(s){
 $("toast").textContent=s;
 $("toast").classList.remove("hidden");
 clearTimeout(toast.t);
 toast.t=setTimeout(
  ()=>$("toast").classList.add("hidden"),1700
 );
}

function setColor(){
 document.body.className=
  phase==="work"?"work":
  phase==="rest"?"rest":
  phase==="done"?"done":"";
}

function uiColor(){
 const color=phase==="rest"?"#1597ff":phase==="done"?"#888":"#32d74b";
 document.documentElement.style.setProperty("--action-color",color);
 document.documentElement.style.setProperty("--line-color",cameraAlert?"#ff3b30":color);
}

function updateActionButton(){
 const b=$("start");
 const label=$("startLabel");
 b.className="action-btn "+(running?"running":"ready");
 if(running){b.textContent="Ⅱ";label.textContent="Pausa";}
 else {b.textContent="▶";label.textContent="Start";}
 uiColor();
}

function nextText(){
 if(phase==="work")return '<span class="next-label">Prossimo</span><strong>Recupero</strong>';
 if(index<sequence.length-1)return '<span class="next-label">Prossimo esercizio</span><strong>'+esc(sequence[index+1].name)+'</strong>';
 return '<span class="next-label">Prossimo</span><strong>Fine sequenza</strong>';
}

function formatTime(sec){
 sec=Math.max(0,Math.floor(sec));
 const m=Math.floor(sec/60);
 const s=sec%60;
 return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function updateRing(){
 const ring=$("timerRing");
 if(!ring)return;
 let total=1;
 if(phase==="work") total=positive(sequence[index].work);
 else if(phase==="rest") total=positive(sequence[index].rest);
 else if(phase==="done") total=1;
 const ratio=Math.max(0,Math.min(1,remaining/total));
 ring.style.setProperty("--ring-progress",(ratio*360)+"deg");
 ring.className="timer-ring "+(phase==="rest"?"rest":phase==="done"?"done":"");
}

function updateCameraUI(){
 $("cameraAlarm").checked=cameraAlarm;
 $("cameraAlarmSettings").checked=cameraAlarm;
 $("cameraStatus").textContent=cameraAlarm?"ON":"OFF";
 $("bpmSummary").textContent=sequence[index]?.bpm ?? 0;
}

window.setCameraAlert=setCameraAlert;

function setCameraAlert(active){
 cameraAlert=!!active;
 $("displayCard").classList.toggle("camera-alert",cameraAlert);
 uiColor();
 if(cameraAlert){
  tone(220,.35,.9);
  setTimeout(()=>tone(160,.35,.9),180);
 }
}

function display(){
 setColor();

 $("phase").textContent=
  phase==="work"?sequence[index].name.toUpperCase():
  phase==="rest"?"RECUPERO":
  phase==="done"?"COMPLETATO":"PRONTO";

 $("progress").textContent=
  phase==="done"
   ?sequence.length+" / "+sequence.length
   :(index+1)+" / "+sequence.length;

 $("timer").textContent=formatTime(remaining);
 updateRing();
 updateActionButton();

 $("status").textContent=
  phase==="done"
   ?"Sequenza terminata"
   :running
    ?(phase==="work"?"Esegui l'esercizio":"Recupera")
    :"In pausa";

 $("next").innerHTML=phase==="done"?"":nextText();
}

function reset(){
 stop(false);
 setCameraAlert(false);

 phase="work";
 index=0;
 remaining=positive(sequence[0].work);
 lastBeep=0;
 midBeepDone=false;

 display();
}

async function audioReady(){
 if(!audio)
  audio=new(window.AudioContext||window.webkitAudioContext)();

 if(audio.state==="suspended")
  await audio.resume();
}

function tone(freq,dur=.16,vol=.62){
 if(!audio)return;

 const now=audio.currentTime;
 const o=audio.createOscillator();
 const g=audio.createGain();

 o.type="sine";
 o.frequency.setValueAtTime(freq,now);

 g.gain.setValueAtTime(.001,now);
 g.gain.linearRampToValueAtTime(vol,now+.012);
 g.gain.exponentialRampToValueAtTime(.001,now+dur);

 o.connect(g);
 g.connect(audio.destination);

 o.start(now);
 o.stop(now+dur);
}

function countdown(s){
 tone(
  {5:620,4:720,3:830,2:980,1:1150}[s],
  .19,
  .66
 );
}

function midpointSound(){
 tone(900,.28,.74);
}

function changeSound(to){
 if(to==="rest"){
  tone(430,.2,.7);
  setTimeout(()=>tone(430,.2,.7),240);
 }
 else if(to==="work"){
  tone(1050,.18,.7);
  setTimeout(()=>tone(1350,.3,.74),240);
 }
 else{
  tone(800,.2,.72);
  setTimeout(()=>tone(1100,.35,.74),240);
 }
}

function rhythmSound(){
 tone(560,.075,.38);
}

function startRhythm(){
 stopRhythm();
 if(!running||phase!=="work")return;
 const bpm=bpmValue(sequence[index].bpm);
 if(bpm<=0)return;
 const interval=60000/bpm;
 rhythmId=setInterval(()=>{
  if(!running||phase!=="work"){ stopRhythm(); return; }
  if(remaining>5)rhythmSound();
 },interval);
}

function stopRhythm(){
 if(rhythmId){clearInterval(rhythmId);rhythmId=null;}
}

async function lockScreen(){
 try{
  if("wakeLock"in navigator)
   wakeLock=await navigator.wakeLock.request("screen");
 }catch(e){}
}

function unlockScreen(){
 if(wakeLock){
  wakeLock.release().catch(()=>{});
  wakeLock=null;
 }
}

function finishPhase(){
 stopRhythm();
 if(phase==="work"){
  phase="rest";
  remaining=positive(sequence[index].rest);
  lastBeep=0;
  midBeepDone=false;

  changeSound("rest");
  display();

  return true;
 }

 if(index<sequence.length-1){
  index++;
  phase="work";
  remaining=positive(sequence[index].work);
  lastBeep=0;
  midBeepDone=false;

  changeSound("work");
  display();
  if(running)startRhythm();

  return true;
 }

 running=false;
 phase="done";
 remaining=0;

 unlockScreen();
 changeSound("done");
 display();

 return false;
}

function tick(){
 const total=positive(sequence[index].work);
 const midpoint=Math.ceil(total/2);

 if(
  phase==="work"&&
  !midBeepDone&&
  remaining===midpoint&&
  remaining>5
 ){
  midpointSound();
  midBeepDone=true;
 }

 if(
  remaining<=5&&
  remaining>=1&&
  remaining!==lastBeep
 ){
  countdown(remaining);
  lastBeep=remaining;
 }

 if(remaining<=1){
  clearInterval(timerId);
  timerId=null;

  if(finishPhase()&&running)
   timerId=setInterval(tick,1000);

  return;
 }

 remaining--;
 display();
}

async function start(){
 if(running||phase==="done")return;
 $("settingsPanel").classList.add("hidden");
 $("back").classList.add("hidden");

 await audioReady();
 await lockScreen();

 tone(700,.08,.4);

 running=true;
 display();
 startRhythm();

 timerId=setInterval(tick,1000);
}

function stop(show=true){
 running=false;
 stopRhythm();

 if(timerId){
  clearInterval(timerId);
  timerId=null;
 }

 unlockScreen();

 if(show&&phase!=="done")
  display();
}

$("add").onclick=()=>{
 sequence.push({
  name:"Esercizio "+(sequence.length+1),
  work:30,
  rest:30,
  bpm:30
 });

 save();
 render();
};

$("start").onclick=()=>{ if(running) stop(true); else start(); };
$("reset").onclick=reset;

$("spotify").onclick=()=>{
 window.location.href="https://open.spotify.com/";
};

function setCameraAlarm(value){
 cameraAlarm=!!value;
 updateCameraUI();
 toast(cameraAlarm?"Allarme telecamera ON":"Allarme telecamera OFF");
}
$("cameraAlarm").addEventListener("change",e=>setCameraAlarm(e.target.checked));
$("cameraAlarmSettings").addEventListener("change",e=>setCameraAlarm(e.target.checked));

$("gear").onclick=()=>{
 $("settingsPanel").classList.remove("hidden");
 $("back").classList.remove("hidden");
};
$("closeSettings").onclick=()=>{
 $("settingsPanel").classList.add("hidden");
 $("back").classList.add("hidden");
};
$("back").onclick=()=>{
 $("settingsPanel").classList.add("hidden");
 $("back").classList.add("hidden");
};
$("testCamera").onclick=async()=>{
 await audioReady();
 setCameraAlert(true);
 setTimeout(()=>setCameraAlert(false),3000);
 toast("Test allarme telecamera");
};

document.addEventListener("visibilitychange",()=>{
 if(document.visibilityState==="visible"&&running)
  lockScreen();
});

load();
render();
updateCameraUI();
reset();
uiColor();
updateActionButton();
</script>
</body>
</html>
