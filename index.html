<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Timer">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">

<title>Timer Allenamento</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #111;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: flex;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 500px;
  padding: 25px 20px;
  text-align: center;
}

h1 {
  margin: 10px 0 25px;
  font-size: 30px;
}

.settings {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 25px;
}

.setting {
  background: #222;
  border-radius: 15px;
  padding: 15px;
}

.setting label {
  display: block;
  font-size: 16px;
  margin-bottom: 8px;
}

input {
  width: 100%;
  font-size: 28px;
  text-align: center;
  background: #333;
  color: white;
  border: 0;
  border-radius: 10px;
  padding: 8px;
}

.phase {
  font-size: 25px;
  font-weight: bold;
  margin-top: 20px;
}

.timer {
  font-size: 110px;
  font-weight: 700;
  line-height: 1;
  margin: 25px 0;
  font-variant-numeric: tabular-nums;
}

.status {
  font-size: 18px;
  min-height: 28px;
  margin-bottom: 25px;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

button {
  border: 0;
  border-radius: 14px;
  padding: 18px 10px;
  font-size: 20px;
  font-weight: 600;
  color: white;
  background: #333;
}

button:active {
  transform: scale(0.97);
}

.start {
  grid-column: span 2;
  background: #198754;
}

.reset {
  background: #444;
}

.info {
  margin-top: 25px;
  font-size: 14px;
  color: #aaa;
  line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">

  <h1>Timer Allenamento</h1>

  <div class="settings">

    <div class="setting">
      <label for="work">Esercizio (sec)</label>
      <input id="work" type="number" min="1" value="30">
    </div>

    <div class="setting">
      <label for="rest">Recupero (sec)</label>
      <input id="rest" type="number" min="1" value="30">
    </div>

  </div>

  <div id="phase" class="phase">PRONTO</div>

  <div id="timer" class="timer">30</div>

  <div id="status" class="status">
    Premi START per iniziare
  </div>

  <div class="buttons">
    <button id="start" class="start">START</button>
    <button id="pause">PAUSA</button>
    <button id="reset" class="reset">RESET</button>
  </div>

  <div class="info">
    Negli ultimi 5 secondi sentirai un segnale acustico ogni secondo.
    Un segnale più lungo indica il cambio di fase.
  </div>

</div>

<script>
let workTime = 30;
let restTime = 30;
let remaining = workTime;
let running = false;
let phase = "work";
let interval = null;
let lastBeep = null;
let audioContext = null;
let wakeLock = null;

const timerEl = document.getElementById("timer");
const phaseEl = document.getElementById("phase");
const statusEl = document.getElementById("status");
const workEl = document.getElementById("work");
const restEl = document.getElementById("rest");

function updateDisplay() {
  timerEl.textContent = remaining;

  if (phase === "work") {
    phaseEl.textContent = "ESERCIZIO";
    statusEl.textContent = "Continua l'esercizio";
  } else {
    phaseEl.textContent = "RECUPERO";
    statusEl.textContent = "Recupera";
  }
}

function beep(frequency = 800, duration = 0.12) {
  if (!audioContext) return;

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.frequency.value = frequency;
  oscillator.type = "sine";

  gain.gain.setValueAtTime(0.001, audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    0.25,
    audioContext.currentTime + 0.01
  );
  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioContext.currentTime + duration
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start();
  oscillator.stop(audioContext.currentTime + duration);
}

async function prepareAudio() {
  if (!audioContext) {
    audioContext = new (window.AudioContext ||
      window.webkitAudioContext)();
  }

  if (audioContext.state === "suspended") {
    await audioContext.resume();
  }
}

async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (e) {
    // Non disponibile: il timer continua comunque.
  }
}

function releaseWakeLock() {
  if (wakeLock) {
    wakeLock.release().catch(() => {});
    wakeLock = null;
  }
}

function startTimer() {
  if (running) return;

  workTime = Math.max(1, parseInt(workEl.value) || 30);
  restTime = Math.max(1, parseInt(restEl.value) || 30);

  prepareAudio();
  requestWakeLock();

  running = true;
  statusEl.textContent = "In corso";

  interval = setInterval(() => {

    if (remaining <= 5 && remaining >= 1 && remaining !== lastBeep) {
      beep(850, 0.10);
      lastBeep = remaining;
    }

    if (remaining <= 0) {
      beep(1200, 0.35);

      if (phase === "work") {
        phase = "rest";
        remaining = restTime;
      } else {
        phase = "work";
        remaining = workTime;
      }

      lastBeep = null;
      updateDisplay();
      return;
    }

    remaining--;
    updateDisplay();

  }, 1000);
}

function pauseTimer() {
  running = false;

  if (interval) {
    clearInterval(interval);
    interval = null;
  }

  releaseWakeLock();
  statusEl.textContent = "In pausa";
}

function resetTimer() {
  pauseTimer();

  workTime = Math.max(1, parseInt(workEl.value) || 30);
  restTime = Math.max(1, parseInt(restEl.value) || 30);

  phase = "work";
  remaining = workTime;
  lastBeep = null;

  phaseEl.textContent = "PRONTO";
  statusEl.textContent = "Premi START per iniziare";
  timerEl.textContent = remaining;
}

workEl.addEventListener("change", resetTimer);
restEl.addEventListener("change", resetTimer);

document.getElementById("start").addEventListener("click", startTimer);
document.getElementById("pause").addEventListener("click", pauseTimer);
document.getElementById("reset").addEventListener("click", resetTimer);

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && running) {
    requestWakeLock();
  }
});

updateDisplay();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js");
  });
}
</script>

</body>
</html>
