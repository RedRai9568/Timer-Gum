<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timer">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Timer Allenamento</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:background .3s}
body.work{background:#168447} body.rest{background:#1769aa} body.done{background:#555}
.app{max-width:560px;margin:auto;padding:16px 14px 28px}
h1{text-align:center;margin:7px 0 16px;font-size:28px}
.card{background:rgba(0,0,0,.22);border-radius:18px;padding:14px;margin-bottom:13px}
.head{display:flex;justify-content:space-between;align-items:center}
.small{font-size:12px;opacity:.8}
.row{display:grid;grid-template-columns:30px 1fr 1fr 42px;gap:7px;align-items:end;margin-top:9px}
.num{text-align:center;font-weight:800;padding-bottom:11px}
label{display:block;font-size:11px;opacity:.8;margin:0 0 3px 2px}
input{width:100%;border:0;border-radius:10px;background:#fff;color:#111;padding:9px 4px;text-align:center;font-size:18px;font-weight:700}
button{border:0;border-radius:13px;padding:13px;font-size:17px;font-weight:700;color:#fff;background:rgba(0,0,0,.28)}
button:active{transform:scale(.98)}
.del{height:42px;padding:0;font-size:24px}
.add{width:100%;margin-top:11px;background:rgba(255,255,255,.18)}
.display{text-align:center;padding:15px 8px}
.phase{font-size:25px;font-weight:800}
.progress{margin-top:3px;font-size:15px;opacity:.9}
.timer{font-size:108px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;margin:18px 0 8px}
.status{min-height:23px;font-size:16px}
.next{min-height:20px;font-size:14px;opacity:.82;margin-top:5px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.start{grid-column:span 2;background:#fff;color:#111;font-size:20px;padding:17px}
.note{font-size:13px;line-height:1.45;opacity:.85}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(0,0,0,.85);padding:11px 14px;border-radius:12px;font-size:14px;z-index:5}
.hidden{display:none}
@media(max-width:390px){.timer{font-size:92px}.row{grid-template-columns:26px 1fr 1fr 40px}}
</style>
</head>
<body>
<div class="app">
<h1>Timer Allenamento</h1>

<section id="setup" class="card">
  <div class="head"><strong>Sequenza</strong><span id="saved" class="small">salvata</span></div>
  <div id="rows"></div>
  <button id="add" class="add">＋ Aggiungi esercizio</button>
</section>

<section class="card display">
  <div id="phase" class="phase">PRONTO</div>
  <div id="progress" class="progress">0 / 0</div>
  <div id="timer" class="timer">30</div>
  <div id="status" class="status">Imposta la sequenza e premi START</div>
  <div id="next" class="next"></div>
</section>

<div class="controls">
  <button id="start" class="start">START</button>
  <button id="pause">PAUSA</button>
  <button id="reset">RESET</button>
</div>

<section class="card note">
Gli ultimi 5 secondi hanno un beep crescente. Il cambio fase usa un segnale distinto.
La sequenza viene salvata automaticamente sull'iPhone.
</section>
</div>
<div id="toast" class="toast hidden"></div>

<script>
const KEY="timer-allenamento-sequence-v3";
let sequence=[{work:30,rest:30}];
let running=false, phase="work", index=0, remaining=30, timerId=null;
let lastBeep=0, audio=null, wakeLock=null;

const $=id=>document.getElementById(id);
function positive(v){const n=parseInt(v,10);return Number.isFinite(n)&&n>0?n:1}
function save(){localStorage.setItem(KEY,JSON.stringify(sequence));$("saved").textContent="salvata"}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(x)&&x.length)sequence=x.map(a=>({work:positive(a.work),rest:positive(a.rest)}))}catch(e){}}

function render(){
  $("rows").innerHTML="";
  sequence.forEach((x,i)=>{
    const r=document.createElement("div");r.className="row";
    r.innerHTML=`<div class="num">${i+1}</div>
    <div><label>ESERCIZIO</label><input type="number" min="1" value="${x.work}" data-i="${i}" data-t="work"></div>
    <div><label>RECUPERO</label><input type="number" min="1" value="${x.rest}" data-i="${i}" data-t="rest"></div>
    <button class="del" data-del="${i}" aria-label="Elimina">×</button>`;
    $("rows").appendChild(r);
  });
  document.querySelectorAll("input").forEach(el=>el.addEventListener("change",e=>{
    const i=+e.target.dataset.i,t=e.target.dataset.t;sequence[i][t]=positive(e.target.value);
    e.target.value=sequence[i][t];save();if(!running) reset(false);
  }));
  document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{
    if(sequence.length===1){toast("Deve rimanere almeno un esercizio.");return}
    sequence.splice(+b.dataset.del,1);save();render();if(!running)reset(false);
  }));
}
function toast(s){$("toast").textContent=s;$("toast").classList.remove("hidden");clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").classList.add("hidden"),1700)}
function setColor(){document.body.className=phase==="work"?"work":phase==="rest"?"rest":phase==="done"?"done":""}
function nextText(){
  if(phase==="work")return "Poi: recupero";
  if(index<sequence.length-1)return "Poi: esercizio "+(index+2);
  return "Poi: fine sequenza";
}
function display(){
  setColor();
  $("phase").textContent=phase==="work"?"ESERCIZIO":phase==="rest"?"RECUPERO":phase==="done"?"COMPLETATO":"PRONTO";
  $("progress").textContent=phase==="done"?sequence.length+" / "+sequence.length:(index+1)+" / "+sequence.length;
  $("timer").textContent=remaining;
  $("status").textContent=phase==="done"?"Sequenza terminata":running?(phase==="work"?"Esegui l'esercizio":"Recupera"):"In pausa";
  $("next").textContent=running?nextText():"";
}
function reset(show=true){stop(false);phase="work";index=0;remaining=positive(sequence[0].work);lastBeep=0;display()}
async function audioReady(){
  if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")await audio.resume();
}
function tone(freq,dur=.16,vol=.58){
  if(!audio)return;
  const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();
  o.type="sine";o.frequency.setValueAtTime(freq,now);
  g.gain.setValueAtTime(.001,now);g.gain.linearRampToValueAtTime(vol,now+.012);
  g.gain.exponentialRampToValueAtTime(.001,now+dur);
  o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+dur);
}
function countdown(s){tone({5:620,4:720,3:830,2:980,1:1150}[s],.19,.62)}
function changeSound(to){
  if(to==="rest"){tone(430,.20,.68);setTimeout(()=>tone(430,.20,.68),240)}
  else if(to==="work"){tone(1050,.18,.68);setTimeout(()=>tone(1350,.30,.72),240)}
  else {tone(800,.20,.7);setTimeout(()=>tone(1100,.35,.72),240)}
}
async function lockScreen(){try{if("wakeLock"in navigator)wakeLock=await navigator.wakeLock.request("screen")}catch(e){}}
function unlockScreen(){if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null}}

function finishPhase(){
  if(phase==="work"){
    phase="rest";remaining=positive(sequence[index].rest);lastBeep=0;changeSound("rest");display();return true;
  }
  if(index<sequence.length-1){
    index++;phase="work";remaining=positive(sequence[index].work);lastBeep=0;changeSound("work");display();return true;
  }
  running=false;phase="done";remaining=0;unlockScreen();changeSound("done");display();return false;
}
function tick(){
  if(remaining<=5&&remaining>=1&&remaining!==lastBeep){countdown(remaining);lastBeep=remaining}
  if(remaining<=1){if(timerId){clearInterval(timerId);timerId=null}if(finishPhase()&&running)timerId=setInterval(tick,1000);return}
  remaining--;display()
}
async function start(){
  if(running||phase==="done")return;
  await audioReady();await lockScreen();tone(700,.08,.4);
  running=true;display();timerId=setInterval(tick,1000)
}
function stop(show=true){
  running=false;if(timerId){clearInterval(timerId);timerId=null}unlockScreen();if(show&&phase!=="done")display()
}
$("add").onclick=()=>{sequence.push({work:30,rest:30});save();render()}
$("start").onclick=start;
$("pause").onclick=()=>stop(true);
$("reset").onclick=()=>reset(true);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&running)lockScreen()});
load();render();reset(false);
</script>
</body>
</html>
